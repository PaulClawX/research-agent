<svg width="1080" height="560" viewBox="0 0 1080 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Research Agent 功能地图</title>
  <desc id="desc">一张展示 Research Agent 四个核心作用的 SVG 功能图：论文润色、teaser 图 prompt、证据审计、可复用 skill library。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F1E5"/>
      <stop offset="0.52" stop-color="#EEF5F1"/>
      <stop offset="1" stop-color="#EAF0FA"/>
    </linearGradient>
    <linearGradient id="core" x1="412" y1="172" x2="666" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12343B"/>
      <stop offset="1" stop-color="#1D5C63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#12343B" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 34px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #12343B; }
      .subtitle { font: 500 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4C6266; }
      .card-title { font: 700 23px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #12343B; }
      .card-text { font: 500 16px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52686D; }
      .core-title { font: 800 32px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .core-text { font: 600 17px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #D9ECE8; }
      .tag { font: 700 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: .06em; }
      .path { stroke: #78A6A3; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 12; }
    </style>
  </defs>

  <rect width="1080" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="110" cy="90" r="72" fill="#F1B24A" opacity="0.16"/>
  <circle cx="970" cy="464" r="92" fill="#2F80ED" opacity="0.12"/>
  <circle cx="902" cy="94" r="46" fill="#47A992" opacity="0.14"/>
  <path d="M62 440C154 396 220 418 296 462C388 516 458 498 540 438C646 360 734 342 850 386C910 409 956 407 1020 378" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.42"/>

  <text x="54" y="70" class="title">一分钟理解 Research Agent</text>
  <text x="54" y="104" class="subtitle">不是单体应用，而是一套把论文写作、图像 prompt 和证据审计串起来的研究工作台。</text>

  <path class="path" d="M404 254C338 210 296 168 248 150"/>
  <path class="path" d="M676 254C746 212 792 176 842 154"/>
  <path class="path" d="M404 336C326 376 284 416 236 446"/>
  <path class="path" d="M676 336C744 376 796 414 846 444"/>

  <g filter="url(#shadow)">
    <rect x="390" y="174" width="300" height="204" rx="34" fill="url(#core)"/>
    <rect x="420" y="204" width="86" height="86" rx="24" fill="#FFFFFF" opacity="0.12"/>
    <path d="M445 250L466 226L487 250L466 274L445 250Z" fill="#F1B24A"/>
    <path d="M461 226H471V274H461V226Z" fill="#F8E4B4"/>
    <path d="M445 245H487V255H445V245Z" fill="#F8E4B4"/>
    <text x="530" y="234" class="tag">SKILL LIBRARY</text>
    <text x="530" y="278" class="core-title">Research Agent</text>
    <text x="530" y="314" class="core-text">选 skill、套模板、跑脚本</text>
    <text x="530" y="342" class="core-text">把研究任务变成可复用流程</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="54" y="130" width="300" height="142" rx="28" fill="#FFFFFF"/>
    <rect x="78" y="154" width="74" height="74" rx="22" fill="#FFF0D4"/>
    <path d="M102 207L129 180L142 193L115 220L96 225L102 207Z" fill="#D9822B"/>
    <path d="M126 183L133 176C136 173 141 173 144 176L147 179C150 182 150 187 147 190L140 197L126 183Z" fill="#12343B"/>
    <path d="M99 214L96 225L107 222L99 214Z" fill="#6B4F2A"/>
    <text x="170" y="170" class="card-title">论文润色</text>
    <text x="170" y="199" class="card-text">Abstract / Intro / Method</text>
    <text x="170" y="224" class="card-text">Rebuttal / Review-and-polish</text>
    <rect x="170" y="238" width="118" height="20" rx="10" fill="#F1B24A" opacity="0.2"/>
    <text x="185" y="253" class="card-text">polish-paper</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="726" y="130" width="300" height="142" rx="28" fill="#FFFFFF"/>
    <rect x="750" y="154" width="74" height="74" rx="22" fill="#E1F0FF"/>
    <rect x="770" y="176" width="34" height="26" rx="5" fill="#2F80ED"/>
    <circle cx="779" cy="184" r="4" fill="#FFFFFF"/>
    <path d="M772 201L783 191L792 198L803 186L812 201H772Z" fill="#CDE7FF"/>
    <path d="M797 172L814 162L809 181L797 172Z" fill="#F1B24A"/>
    <text x="842" y="170" class="card-title">Teaser 图 Prompt</text>
    <text x="842" y="199" class="card-text">把方法变成图像模型</text>
    <text x="842" y="224" class="card-text">能理解的视觉 brief</text>
    <rect x="842" y="238" width="152" height="20" rx="10" fill="#2F80ED" opacity="0.14"/>
    <text x="856" y="253" class="card-text">gpt-image-teaser</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="54" y="338" width="300" height="142" rx="28" fill="#FFFFFF"/>
    <rect x="78" y="362" width="74" height="74" rx="22" fill="#E2F5EF"/>
    <path d="M115 376L140 386V405C140 421 129 431 115 436C101 431 90 421 90 405V386L115 376Z" fill="#1D8A6F"/>
    <path d="M101 405L111 415L130 392" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="170" y="378" class="card-title">证据审计</text>
    <text x="170" y="407" class="card-text">检查 claim、表格、数值</text>
    <text x="170" y="432" class="card-text">实验日志是否互相支持</text>
    <rect x="170" y="446" width="130" height="20" rx="10" fill="#1D8A6F" opacity="0.14"/>
    <text x="184" y="461" class="card-text">audit scripts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="726" y="338" width="300" height="142" rx="28" fill="#FFFFFF"/>
    <rect x="750" y="362" width="74" height="74" rx="22" fill="#F3E9FF"/>
    <path d="M786 377C795 377 802 384 802 393C802 402 795 409 786 409C777 409 770 402 770 393C770 384 777 377 786 377Z" fill="#7C4DFF"/>
    <path d="M786 367V378M786 408V419M812 393H801M771 393H760M804 375L797 382M775 404L768 411M768 375L775 382M797 404L804 411" stroke="#7C4DFF" stroke-width="6" stroke-linecap="round"/>
    <text x="842" y="378" class="card-title">可复用工作流</text>
    <text x="842" y="407" class="card-text">每个 skill 都有说明、</text>
    <text x="842" y="432" class="card-text">模板、agent 配置</text>
    <rect x="842" y="446" width="104" height="20" rx="10" fill="#7C4DFF" opacity="0.14"/>
    <text x="856" y="461" class="card-text">portable</text>
  </g>

  <g opacity="0.9">
    <rect x="390" y="428" width="300" height="58" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="424" cy="457" r="11" fill="#F1B24A"/>
    <circle cx="462" cy="457" r="11" fill="#2F80ED"/>
    <circle cx="500" cy="457" r="11" fill="#1D8A6F"/>
    <text x="532" y="463" class="card-text">一个仓库，四类研究助手能力</text>
  </g>
</svg>
